# for reference only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-bigip-ctlr-deployment
  namespace: kube-system
spec:
  # DO NOT INCREASE REPLICA COUNT
  replicas: 1
  selector:
    matchLabels:
      app: k8s-bigip-ctlr-deployment
  template:
    metadata:
      labels:
        app: k8s-bigip-ctlr-deployment
    spec:
      # Name of the Service Account bound to a Cluster Role with the required
      # permissions
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      volumes:
        - name: bigip-creds
          secret:
            secretName: f5-bigip-ctlr-login
      containers:
        - name: k8s-bigip-ctlr
          image: "f5networks/k8s-bigip-ctlr:2.20.3"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 120
            successThreshold: 1
            timeoutSeconds: 15
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 120
            successThreshold: 1
            timeoutSeconds: 15
          volumeMounts:
            - name: bigip-creds
              mountPath: "/tmp/creds"
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ "ALL" ]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command: ["/app/bin/k8s-bigip-ctlr"]
          args: [
            # See the k8s-bigip-ctlr documentation for information about
            # all config options
            # https://clouddocs.f5.com/containers/latest/userguide/config-parameters.html
            # here are some deployment parameters for your considerations
            "--credentials-directory=/tmp/creds",
            #"--bigip-username=admin",
            #"--bigip-password=f5demo#1",
            #"--bigip-url=10.1.10.7",
            "--bigip-partition=k8s-cis",
            "--pool-member-type=cluster",
            "--insecure=true",
            "--static-routing-mode=true",
            "--orchestration-cni=calico-k8s",
            "--log-as3-response=true",
            # Logging level
            "--log-level=DEBUG",
            # "--ipam=true",
          ]
      serviceAccountName: bigip-ctlr
